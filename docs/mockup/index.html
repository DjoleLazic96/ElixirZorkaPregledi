<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPM pregledi – mockup</title>
<style>
:root{
  --g:#006937; --g2:#004f29; --gl:#80bc00; --gbg:#e8f3ec; --ink:#3d3935; --mut:#6c6966; --line:#dcdad7; --bg:#f4f5f3; --card:#fff;
  --red:#c62828; --redbg:#fdecea; --yel:#f2b600; --yelbg:#fff6d6; --blu:#1565c0; --blubg:#e3eefb; --grn:#2e7d32; --grnbg:#e7f4e8; --gray:#9e9b97;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#e9ebe8;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
#mockbar{position:sticky;top:0;z-index:50;background:#2b2926;color:#fff;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:8px 16px;font-size:13px}
#mockbar b{color:var(--gl)}
#mockbar label{display:flex;gap:6px;align-items:center}
#mockbar select{background:#3d3935;color:#fff;border:1px solid #6c6966;border-radius:6px;padding:3px 6px}
.seg{display:inline-flex;border:1px solid #6c6966;border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:#ddd;padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
#mockbar .note{margin-left:auto;color:#bbb}
#stage{padding:18px;display:flex;justify-content:center}
#app{background:var(--bg);width:100%;max-width:1360px;min-height:calc(100vh - 80px);display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;border-radius:10px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.phone #app{max-width:390px;min-height:780px;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;border-radius:26px;border:10px solid #2b2926}
header.top{grid-column:1/-1;background:#fff;border-bottom:3px solid var(--g);display:flex;align-items:center;gap:12px;padding:8px 16px;position:relative}
header.top img{height:34px}
.phone header.top img{height:26px}
header.top .sp{flex:1}
.pw{position:relative}.pw .inp{padding-right:44px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:17px;padding:4px 6px;color:var(--mut)}
.srch{background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:5px 10px;color:var(--mut);font-size:13px;white-space:nowrap}
.qm{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--g);color:var(--g);background:#fff;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:middle;padding:0}
.refimg{background:#f7f8f6;border:1px dashed var(--line);border-radius:8px;height:120px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;margin:8px 0}
.offbar{background:var(--orgbg,#fff3e0);color:#9a4a00;border:1px solid #f0b37a;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;margin-bottom:10px}
.phone header.top{gap:6px}
.phone header.top img{flex-shrink:0}
mark.hl{background:#ffeb3b;color:inherit;padding:0 1px;border-radius:2px}
.bell{position:relative;background:none;border:0;cursor:pointer;font-size:20px;padding:4px}
.bell i{position:absolute;top:0;right:-2px;background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:1px 5px}
.who{font-size:12px;text-align:right;line-height:1.2}.who b{display:block;font-size:13px}
.phone .who{display:none}
nav.side{background:var(--g);color:#fff;padding:12px 0;overflow:auto}
nav.side a{display:flex;gap:10px;align-items:center;padding:10px 18px;color:#e6f2ea;text-decoration:none;cursor:pointer;border-left:4px solid transparent}
nav.side a:hover{background:var(--g2)}
nav.side a.on{background:var(--g2);border-left-color:var(--gl);color:#fff;font-weight:600}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#a8d5b8;padding:14px 18px 4px}
.phone nav.side{display:none}
nav.bottom{display:none}
.phone nav.bottom{display:flex;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 8px}
nav.bottom a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);cursor:pointer;gap:2px;min-width:60px}
nav.bottom a span{font-size:19px}
nav.bottom a.on{color:var(--g);font-weight:600}
main{padding:20px 24px 40px;overflow:auto}
.phone main{padding:12px 12px 24px}
h1{font-size:22px;margin:0 0 4px;color:var(--ink)}
.phone h1{font-size:19px}
h2{font-size:16px;margin:22px 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.phone .grid{grid-template-columns:1fr}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.phone .grid.wide{grid-template-columns:1fr}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.phone .kpis{grid-template-columns:1fr 1fr}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi b{display:block;font-size:26px;color:var(--g)}
.kpi.warn b{color:var(--red)}
.kpi span{color:var(--mut);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--g);background:var(--g);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--g)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink);font-weight:500}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row:has(> .fld){align-items:flex-end}
/* tabele i trake ne izlaze iz okvira */
.tb th{white-space:normal!important;vertical-align:bottom}
.tb th,.tb td{padding-left:8px!important;padding-right:8px!important}
.chips,.tabs{flex-wrap:wrap}
.phone .tb td{flex-wrap:wrap}
.phone .tb td>*{min-width:0!important;max-width:100%}
.phone .tb td:has(> .tdv){flex-wrap:nowrap}
.tdv{display:block}
.phone .tdv{flex:1;min-width:0}
.phone .tdv *{min-width:0!important}
.stack{flex-direction:column;align-items:flex-start!important}
.tb td .badge{white-space:normal;line-height:1.3}
.row:has(> .fld)>.btn{min-height:37px;box-sizing:border-box}
.row:has(> .fld) span.inp{min-height:37px;box-sizing:border-box;display:flex;align-items:center}
.right{margin-left:auto}
.badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.b-gray{background:#eceae7;color:#55524e}.b-yel{background:var(--yelbg);color:#7a5a00}.b-grn{background:var(--grnbg);color:var(--grn)}.b-blu{background:var(--blubg);color:var(--blu)}.b-red{background:var(--redbg);color:var(--red)}.b-org{background:#fff0e0;color:#a24f00}
.muted{color:var(--mut)}.small{font-size:12px}
.mine{border-left:4px solid var(--gl)}
.list{display:flex;flex-direction:column;gap:8px}
.list .it{position:relative;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 10px;background:#f7f8f6;border:1px solid var(--line);border-radius:14px;padding:10px 30px 10px 12px;cursor:pointer;transition:background .15s,border-color .15s}
.list .it:hover{background:var(--gbg);border-color:#b9d6c3}
.list .it::after{content:"›";position:absolute;right:12px;top:9px;color:var(--mut);font-size:18px}
.list .it>span:first-child:not(.t){font-size:18px;line-height:1.2}
.list .it .t{flex:1 1 calc(100% - 40px);min-width:0}
.list .it .t b{display:block;overflow-wrap:anywhere}
.list .it .t .id{font-size:11px;color:var(--g);font-weight:700;letter-spacing:.02em}
.list .it>.badge{margin-left:0}
.list .it.mi{border-left:4px solid var(--gl)}
table.tb{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.tb th{background:var(--gbg);text-align:left;padding:8px 10px;border-bottom:2px solid var(--g);cursor:pointer;white-space:nowrap;user-select:none}
.tb th .ar{color:var(--g);font-size:10px}
.tb td{padding:8px 10px;border-bottom:1px solid #eee;vertical-align:top}
.tb tr.click{cursor:pointer}.tb tr.click:hover td{background:#f7faf8}
.tb tr.over td{background:#fff4f3}
.tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
.phone table.tb, .phone .tb tbody, .phone .tb tr, .phone .tb td{display:block;width:100%}
.phone .tb thead{display:none}
.phone .tb tr{border-bottom:8px solid var(--bg);padding:6px 0}
.phone .tb td{border:0;padding:3px 12px;display:flex;gap:8px}
.phone .tb td::before{content:attr(data-l);color:var(--mut);min-width:96px;font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:2px}
.filters input,.filters select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;min-width:120px}
.phone .filters{display:none}.phone .filters.open{display:flex}
.fbtn{display:none}.phone .fbtn{display:inline-flex}
.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea.inp{min-height:70px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px}
.fld>span{color:var(--mut);font-size:12px}
/* popunjavanje */
.insp-head{background:var(--g);color:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.insp-head .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:#d7ecdf;margin-top:4px}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;white-space:nowrap;cursor:pointer;font-size:12px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip.done{border-color:var(--gl)}
.dev{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.dev>.dh{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.dev>.dh b{flex:1}
.dev.nf{opacity:.75}
.dev .db{padding:0 12px 10px;border-top:1px solid #eee}
.act{padding:10px 0;border-bottom:1px dashed #e4e2df}
.act:last-child{border-bottom:0}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.ans button{border:2px solid var(--line);background:#fff;border-radius:9px;padding:11px 6px;cursor:pointer;font-weight:600}
.ans button.ok{border-color:var(--grn);background:var(--grnbg);color:var(--grn)}
.ans button.bad{border-color:var(--red);background:var(--redbg);color:var(--red)}
.tools{display:flex;gap:6px}
.tools button{flex:1;border:1px solid var(--line);background:#fafaf9;border-radius:8px;padding:6px;font-size:12px;cursor:pointer}
.tools button.has{border-color:var(--g);color:var(--g);font-weight:600}
.tools button.need{border-color:var(--red);color:var(--red)}
.extra{display:flex;gap:8px;align-items:center;margin:6px 0;background:var(--gbg);border-radius:8px;padding:6px 8px;font-size:12px}
.extra input{width:70px;border:1px solid var(--line);border-radius:6px;padding:5px}
.banner{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13px}
.banner.info{background:var(--blubg);color:#0d3c73}
.banner.warn{background:var(--yelbg);color:#5c4300}
.banner.err{background:var(--redbg);color:#7f1d1d}
.banner.ok{background:var(--grnbg);color:#1b4d1e}
.thumbs{display:flex;gap:6px;margin-top:6px}
.thumb{width:44px;height:44px;border-radius:6px;background:linear-gradient(135deg,#b9c9bd,#7d9584);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,20,20,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px}
#modal h3{margin:0 0 10px}
.pop{position:absolute;right:12px;top:52px;width:340px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:40;padding:6px 0;display:none}
.pop.open{display:block}
.pop .n{padding:9px 14px;border-bottom:1px solid #eee;font-size:13px}
.pop .n small{display:block;color:var(--mut)}
/* kalendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11px;color:var(--mut);text-align:center;padding:4px}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:84px;padding:5px;font-size:11px}
.cal .d.off{background:#f0efed;color:var(--gray)}
.cal .d.today{border:2px solid var(--g)}
.cal .d .n{font-weight:700;font-size:12px}
.ev{display:block;border-radius:5px;padding:2px 5px;margin-top:3px;font-weight:600;cursor:pointer}
.ev.zav{background:var(--grnbg);color:var(--grn)} .ev.ove{background:var(--blubg);color:var(--blu)} .ev.nez{background:var(--redbg);color:var(--red)} .ev.urd{background:var(--yelbg);color:#7a5a00} .ev.pla{background:#fff;border:1px solid var(--line);color:var(--mut)}
.phone .cal{grid-template-columns:1fr}.phone .cal .dh{display:none}.phone .cal .d{min-height:0}.phone .cal .d.empty{display:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:8px 0}
.legend span{display:flex;gap:4px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* timeline / bars */
.tl{display:flex;gap:2px;flex-wrap:wrap}
.tl i{width:14px;height:26px;border-radius:3px;display:inline-block}
.bars .b{display:grid;grid-template-columns:minmax(0,42%) minmax(70px,1fr) 34px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.bars .b>span:first-child{overflow-wrap:anywhere}
.bars .b>span:last-child{text-align:right}
.phone .bars .b{grid-template-columns:minmax(0,45%) minmax(60px,1fr) 34px}
.bars .b div{background:#eef1ee;border-radius:4px;height:14px}
.bars .b div i{display:block;height:14px;border-radius:4px;background:var(--g)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat div{background:var(--gbg);border-radius:8px;padding:10px}
.stat b{display:block;font-size:20px;color:var(--g2)}
.stat span{font-size:12px;color:var(--mut)}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.diff-add{color:var(--grn)}.diff-del{color:var(--red);text-decoration:line-through}.diff-chg{color:#a24f00}
.login{max-width:360px;margin:40px auto;background:#fff;border-radius:12px;border:1px solid var(--line);padding:26px}
.login img{width:220px;display:block;margin:0 auto 18px}
.hist{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.hist div{margin-bottom:10px;font-size:13px;position:relative}
.hist div::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--g)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow:auto}
.tabs a{padding:8px 12px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--g);border-bottom-color:var(--g);font-weight:600}
.hide-phone{}.phone .hide-phone{display:none}
</style>
</head>
<body>
<div id="mockbar">
  <span><b>MOCKUP</b> · TPM pregledi · izmišljeni podaci</span>
  <label>Uloga <select id="roleSel">
    <option value="ing">Inženjer – Marko Jovanović</option>
    <option value="sup">Supervizor – Ana Marković</option>
    <option value="dir">Direktor – Zoran Nikolić</option>
    <option value="adm">Admin – Jelena Popović</option>
  </select></label>
  <span class="seg" id="viewSeg"><button data-v="phone">Telefon</button><button data-v="laptop">Laptop</button></span>
  <span class="seg" id="netSeg"><button data-n="1">Ima interneta</button><button data-n="0">Bez interneta</button></span>
  <span class="note">Klikni bilo šta – prikaz je samo za dogovor izgleda i toka.</span>
</div>
<div id="stage"><div id="app"></div></div>
<div id="modal"><div class="box" id="mbox"></div></div>

/* ---------------- generički prikaz tabele (sortiranje, filteri, pretraga) ---------------- */
function table(key,cols,rows,opt={}){
  const f=S.filt[key]||(S.filt[key]={}); const so=S.sort[key]||{};
  let r=rows.filter(x=>{
    for(const c of cols){ if(c.f && f[c.k] && String(x[c.k])!==f[c.k]) return false; }
    if(f._q){const t=f._q.toLowerCase(); if(!cols.some(c=>String(x[c.k]??'').toLowerCase().includes(t))) return false;}
    if(opt.extraFilter && !opt.extraFilter(x,f)) return false;
    return true;});
  if(so.k){r=[...r].sort((a,b)=>{const A=a[so.k],B=b[so.k];const n=(typeof A==='number')?A-B:String(A).localeCompare(String(B),'sr');return so.d?-n:n})}
  const fl=cols.filter(c=>c.f).map(c=>{const vals=[...new Set(rows.map(x=>x[c.k]))].sort();
    return `<label>${c.l}<select onchange="setF('${key}','${c.k}',this.value)"><option value="">Sve</option>${vals.map(v=>`<option ${f[c.k]===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}).join('');
  const dr = opt.dates?`<label>Datum od<input type="date" value="2026-10-01"></label><label>Datum do<input type="date" value="2026-10-26"></label>`:'';
  const ex = opt.extraHtml||'';
  return `<div class="row" style="margin-bottom:8px">
     <button class="btn ghost sm fbtn" onclick="this.parentNode.nextElementSibling.classList.toggle('open')">⚙ Filteri</button>
     <span class="muted small">${r.length} od ${rows.length}</span>
     <span class="right row">${opt.export!==false?`<button class="btn ghost sm" onclick="exp('Excel')">⬇ Excel</button>${opt.pdf?`<button class="btn ghost sm" onclick="exp('PDF')">⬇ PDF</button>`:''}`:''}</span></div>
   <div class="filters">${dr}${fl}${ex}<label>Pretraga<input placeholder="tekst…" value="${esc(f._q||'')}" onchange="setF('${key}','_q',this.value)"></label>
     <button class="btn ghost sm" onclick="S.filt['${key}']={};render()">Poništi filtere</button></div>
   <div class="tablewrap" data-q="${esc(f._q||'')}"><table class="tb"><thead><tr>${cols.map(c=>`<th onclick="setSort('${key}','${c.k}')">${c.l} <span class="ar">${so.k===c.k?(so.d?'▼':'▲'):'↕'}</span></th>`).join('')}</tr></thead>
   <tbody>${r.map(x=>`<tr class="${opt.click?'click':''} ${opt.rowCls?opt.rowCls(x):''}" ${opt.click?`onclick="${opt.click(x)}"`:''}>${cols.map(c=>`<td data-l="${c.l}"><span class="tdv">${c.r?c.r(x):esc(x[c.k])}</span></td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="muted">Nema rezultata.</td></tr>`}</tbody></table></div>`;
}
function setF(k,c,v){S.filt[k][c]=v;render()}
function setSort(k,c){const s=S.sort[k]||{};S.sort[k]={k:c,d:s.k===c?!s.d:false};render()}

function hl(root,qs){if(!root||!qs||qs.length<2)return;const re=new RegExp(qs.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('input,select,textarea,option,mark,button')||!re.test(n.nodeValue)?NodeFilter.FILTER_REJECT:(re.lastIndex=0,NodeFilter.FILTER_ACCEPT)});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const f=document.createDocumentFragment();let last=0;n.nodeValue.replace(re,(m,i)=>{f.append(n.nodeValue.slice(last,i));const k=document.createElement('mark');k.className='hl';k.textContent=m;f.append(k);last=i+m.length});f.append(n.nodeValue.slice(last));n.replaceWith(f)})}

function allPregledi(){ // radni dani unazad ~13 meseci: DP1/DP2 naizmenično; PZ svake 3. nedelje četvrtkom (tad nema DP)
  if(ALLP)return ALLP;ALLP=[];

  for(let k=0;k<400;k++){const d=new Date(D0);d.setDate(d.getDate()-k);const wd=d.getDay();if(wd===0||wd===6)continue;

    const pz=wd===4&&Math.round((new Date(2026,9,15)-d)/864e5)%21===0&&d<=new Date(2026,9,15);
    const tip=pz?pzc[pzi++%4]:next; if(!pz)next=next==='DP1'?'DP2':'DP1';

const HC={};

  let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;const rnd=()=>((h=(h*1103515245+12345)>>>0)/4294967296);
  const L=allPregledi().filter(x=>tpls.includes(x.tip)).map(x=>({...x}));
  let bad=false;for(let i=L.length-1;i>=0;i--){bad=bad?rnd()<.5:rnd()<.035;L[i].s=bad?'r':'g'}
  const st=devStatus(n);L.slice(0,2).forEach(x=>x.s=st==='Otvoren kvar'?'r':'g');

  if(n==='Transporter 20-C-07 (B 1000)')L.forEach(x=>{if(['DP1-2026-0103','DP1-2026-0100'].includes(x.br))x.s='r'}); // usklađeno sa dosijeom

  if (cur) { if (pm && pm.st === 'U radu' && cur.vrsta === 'rad' && pm.lok !== cur.lok) cur.lok = pm.lok; cur.do = null; seg.push(cur) }
  else if (pm) seg.push({ lok: pm.st === 'U radu' ? pm.lok : pm.st + ' – ' + pm.lok, vrsta: pm.st === 'U radu' ? 'rad' : pm.st === 'Na servisu' ? 'ser' : 'mag', od: null, do: null });
  seg.forEach(s => s.dana = s.od ? dd(s.od, s.do || T_ISO) : null);
  return seg.filter(s => !(s.vrsta === 'mag' && s.dana === 0 && s.do));  // isti dan skinuta i poslata — bez praznog reda
}
function pumpStats(oz) {
  const tl = timeline(oz), sum = v => tl.filter(s => s.vrsta === v && s.dana != null).reduce((a, s) => a + s.dana, 0);
  const rad = tl.filter(s => s.vrsta === 'rad' && s.dana != null && s.kraj === 'kvar');
  const sv = PD.servis.filter(s => s.oz === oz);
  return { rad: sum('rad'), ser: sum('ser'), mag: sum('mag'), kvarova: PD.ev.filter(e => e.sk === oz && e.vrsta === 'kvar').length,
    mtbf: rad.length ? Math.round(rad.reduce((a, s) => a + s.dana, 0) / rad.length) : null, servisa: sv.length, trosak: sv.reduce((a, s) => a + (s.cena || 0), 0), tl };
}
function posStats(k) {
  const e = PD.ev.filter(x => x.poz === k), d = e.map(x => x.d).sort();
  const g = d.slice(1).map((x, i) => dd(d[i], x)).filter(x => x > 0);
  const last = [...e].reverse().find(x => x.ug);
  return { zamena: e.length, mtbf: g.length ? Math.round(g.reduce((a, b) => a + b, 0) / g.length) : null, od: last ? last.d : null };
}

const zLink = k => `<a href="#" onclick="event.stopPropagation();go('ppoz',{poz:'${esc(k)}'});return false">${esc(k)}</a>`;
function pbars(arr, max, fmtv) { return `<div class="bars">${arr.map(b => `<div class="b"><span>${esc(b[0])}</span><div><i style="width:${max ? b[1] / max * 100 : 0}%"></i></div><span>${fmtv ? fmtv(b[1]) : b[1]}</span></div>`).join('')}</div>` }

function mojiPosloviPs(me) { const r = []; PSL.filter(p => p.st !== 'Zaključeno').forEach(p => { const n = p.stavke.filter(s => s.zad === me && !s.ur).length; if (n) r.push([p, n]) });
  return r.map(([p, n]) => `<div class="it" onclick="go('ps',{id:${p.id}});S.filt.pss={zad:'${esc(me)}'}"><span>🧰</span><span class="t"><b>Plansko stajanje ${isoD(p.datum)}: ${n} ${n === 1 ? 'posao dodeljen' : n < 5 ? 'posla dodeljena' : 'poslova dodeljeno'} meni</b><span class="small muted">${esc(p.pz)}</span></span></div>`).join('') }
const prethodno = ps => PSL.filter(p => p.datum < ps.datum && p.st === 'Zaključeno').sort((a, b) => b.datum.localeCompare(a.datum))[0];
const sl4 = t => /motor|elektro|ormar|automatik|senzor/i.test(t) ? 'Elektro održavanje' : 'Mašinsko održavanje';

/* kandidati: ništa ne ulazi samo — neko štiklira */
function kandidati(ps) {
  const u = new Set(ps.stavke.map(s => s.ref).filter(Boolean)), K = [];
  ACTIONS.filter(a => a.st === 'Otvorena').forEach(a => K.push({ ref: a.br, izv: 'akcija', n: `${a.vrsta}: ${a.opis || a.akt} — ${a.dev}`, sl: sl4(a.opis + a.vrsta), pr: a.hit === 'U sledećem planskom zastoju' ? 'Visok' : a.hit === 'Hitno' ? 'Mora' : 'Srednji',
    pre: a.hit === 'U sledećem planskom zastoju', info: `${hitBadge(a.hit)} · iz ${a.iz}` }));
  FAULTS.filter(f => f.st === 'Otvoren' && !relA(f).some(a => a.st === 'Otvorena')).forEach(f => K.push({ ref: f.br, izv: 'kvar', n: `Otkloniti kvar: ${f.akt} — ${f.dev} („${f.nap}“)`, sl: sl4(f.nap), pr: 'Srednji', info: `otvoren od ${f.od} (${f.dana} dana)` }));
  const pr = prethodno(ps);
  if (pr) pr.stavke.filter(s => s.ur === 'NE').forEach(s => K.push({ ref: 'PS' + pr.id + '-' + s.id, izv: 'preneto', n: s.n, sl: s.sl, pr: s.pr, info: `nije urađeno ${isoD(pr.datum)}${s.nap ? ': ' + esc(s.nap) : ''}` }));
  if (typeof PD !== 'undefined') PD.pozicije.filter(z => !z.cur).forEach(z => K.push({ ref: 'POZ-' + z.poz, izv: 'pumpa', n: `Ugraditi pumpu na ${z.poz} (pozicija bez pumpe)`, sl: 'Mašinsko održavanje', pr: 'Visok', info: `tip ${z.osn}` }));
  return K.filter(k => !u.has(k.ref));
}

function scrStajanje() {
  const can = ['sup', 'dir'].includes(S.role);
  const rows = PSL.map(p => { const d = p.stavke.filter(s => s.ur === 'DA').length, m = p.stavke.filter(s => s.pr === 'Mora' && s.ur === 'NE').length;
    return { ...p, iso: p.datum, n: p.stavke.length, pct: p.stavke.length && p.st === 'Zaključeno' ? Math.round(d / p.stavke.length * 100) + ' %' : '—', mora: m } });
  return `<h1>Plansko stajanje</h1><p class="sub">Druga faza · spisak poslova za planski zastoj, po službama i prioritetima; izvršenje i prenos neurađenog na sledeće stajanje</p>
   ${can ? `<div class="row" style="margin-bottom:10px"><button class="btn" onclick="novoPsDlg()">+ Novo plansko stajanje</button><span class="small muted">Stajanje nastaje i samo, kad se u Rasporedu zakaže PZ.</span></div>` : ''}` +
    table('psl', [{ k: 'iso', l: 'Datum', r: x => `<b>${isoD(x.datum)}</b>` }, { k: 'pz', l: 'PZ' }, { k: 'traj', l: 'Trajanje (h)' }, { k: 'st', l: 'Status', f: 1, r: x => `<span class="badge ${x.st === 'Zaključeno' ? 'b-gray' : x.st === 'Potvrđen plan' ? 'b-grn' : 'b-yel'}">${x.st}</span>` },
      { k: 'n', l: 'Stavki' }, { k: 'pct', l: 'Urađeno' }, { k: 'mora', l: '„Mora“ neurađeno', r: x => x.mora ? `<span class="badge b-red">${x.mora}</span>` : '0' }], rows, { click: x => `go('ps',{id:${x.id}})` }) +
    `<p class="small muted">Stajanje nastaje kad se zakaže PZ (aplikacija tada nudi šta nije urađeno). ${can ? '' : 'Plan prave Supervizor i Direktor; izvršenje unose inženjeri.'}</p>`;
}

function scrPs() {
  const ps = psById(S.p.id) || PSL[1], can = ['sup', 'dir'].includes(S.role), zak = ps.st === 'Zaključeno', K = kandidati(ps);
  const st = ps.stavke.map(s => ({ ...s, po: PRIO.indexOf(s.pr), tr: s.poc && s.kraj ? hm(toMin(s.kraj) - toMin(s.poc)) : '' }));
  const sati = SLUZBE.map(sl => { const x = ps.stavke.filter(s => s.sl === sl); return [sl, x.length, Math.round(x.reduce((a, s) => a + s.lj * s.vr, 0) / 60)] });
  const done = p => { const x = ps.stavke.filter(s => s.pr === p); return x.length ? `${x.filter(s => s.ur === 'DA').length}/${x.length}` : '—' };
  const inp = (s, f, w, ph) => zak ? esc(s[f] ?? '') : `<input class="inp" style="width:${w}px;padding:4px 6px" value="${esc(s[f] ?? '')}" placeholder="${ph || ''}" onclick="event.stopPropagation()" onchange="psSet(${ps.id},'${s.id}','${f}',this.value)">`;
  return `<p><a href="#" onclick="goBack('stajanje');return false">‹ Nazad</a></p>
  <h1>Plansko stajanje ${isoD(ps.datum)}</h1><p class="sub">${esc(ps.pz)} · trajanje ${ps.traj} h · <span class="badge ${zak ? 'b-gray' : ps.st === 'Potvrđen plan' ? 'b-grn' : 'b-yel'}">${ps.st}</span></p>
  <div class="grid wide" style="margin-bottom:14px">${pzKartica(ps)}</div>
  ${!zak && ps.stavke.some(s => !s.zad) ? `<div class="banner info">Nije dodeljeno: <b>${ps.stavke.filter(s => !s.zad).length}</b> ${ps.stavke.filter(s => !s.zad).length === 1 ? 'stavka' : 'stavki'}. Zaduženi dobija obaveštenje i vidi posao u „Moje aktivnosti“.</div>` : ''}
  ${!zak && K.length ? `<div class="banner warn">Šta nije urađeno: <b>${K.length}</b> kandidata (otvorene akcije, kvarovi, neurađeno sa prošlog stajanja, pozicije bez pumpe). Ništa ne ulazi samo — štiklira se šta ide u ovo stajanje. ${can ? `<button class="btn sm" onclick="kandDlg(${ps.id})">Izaberi iz kandidata</button>` : ''}</div>` : ''}
  <div class="row" style="margin-bottom:12px">${can && !zak ? `<button class="btn sec sm" onclick="psStavkaDlg(${ps.id})">+ Ručna stavka</button>${ps.st === 'U pripremi' ? `<button class="btn sm" onclick="psById(${ps.id}).st='Potvrđen plan';render()">Potvrdi plan</button>` : ''}<button class="btn ghost sm" onclick="zakljuciDlg(${ps.id})">Zaključi stajanje</button>` : ''}
    <span class="right row"><button class="btn ghost sm" onclick="exp('Excel')">⬇ Excel (kao sadašnji izveštaj)</button><button class="btn ghost sm" onclick="exp('PDF')">⬇ PDF</button></span></div>
  <div class="grid wide"><div class="card"><h2 style="margin-top:0">Po službi</h2><div class="list">${sati.map(s => `<div class="it"><span class="t"><b>${s[0]}</b><span class="small muted">${s[1]} stavki · planirano ${s[2]} radnih sati (ljudi × vreme)</span></span></div>`).join('')}</div></div>
   <div class="card"><h2 style="margin-top:0">Urađeno po prioritetu</h2><div class="stat">${PRIO.map(p => `<div><b>${done(p)}</b><span>${p}</span></div>`).join('')}</div>
   <p class="small muted">Neurađena stavka sa prioritetom „Mora“ traži razlog i obaveštava Direktora.</p></div></div>
  ${table('pss', [{ k: 'po', l: 'Prioritet', r: x => zak || !can ? prioBadge(x.pr) : `<select class="inp" style="width:auto;padding:4px" onclick="event.stopPropagation()" onchange="psSet(${ps.id},'${x.id}','pr',this.value)">${PRIO.map(p => `<option ${p === x.pr ? 'selected' : ''}>${p}</option>`).join('')}</select>` },
    { k: 'sl', l: 'Služba', f: 1 }, { k: 'zad', l: 'Zadužen', f: 1, r: x => zak || !can ? esc(x.zad || '—') : zadSel('', x.zad, `onclick="event.stopPropagation()" onchange="psSet(${ps.id},'${x.id}','zad',this.value)"`) },
    { k: 'n', l: 'Rad', r: x => `<div style="min-width:170px">${esc(x.n)}${x.uzPz ? ` <span class="badge b-grn">uz ${esc(ps.pz.split('-')[0])}</span>` : ''}<div class="small muted">${esc(x.izv)}${x.ref ? ' · ' + esc(x.ref) : ''}${can && !zak && !x.ur ? ` · <a href="#" style="color:var(--red)" onclick="event.stopPropagation();ukloniDlg(${ps.id},'${x.id}');return false">✕ ukloni</a>` : ''}</div>${can && !zak ? `<label class="small muted" style="display:block;margin-top:2px" onclick="event.stopPropagation()"><input type="checkbox" ${x.uzPz ? 'checked' : ''} onchange="psSet(${ps.id},'${x.id}','uzPz',this.checked)"> radi se uz PZ</label>` : ''}</div>` },
    { k: 'vr', l: 'Plan', r: x => `<span style="white-space:nowrap">${x.lj} × ${hm(x.vr)}</span>` },
    { k: 'ur', l: 'Urađeno', f: 1, r: x => zak ? `<span class="badge ${x.ur === 'DA' ? 'b-grn' : x.ur === 'NE' ? 'b-red' : 'b-gray'}">${x.ur || '—'}</span>` : `<select class="inp" style="width:auto;padding:4px" onclick="event.stopPropagation()" onchange="psUr(${ps.id},'${x.id}',this.value)"><option value="">—</option>${['DA', 'NE'].map(v => `<option ${v === x.ur ? 'selected' : ''}>${v}</option>`).join('')}</select>` },
    { k: 'poc', l: 'Izvršenje (ljudi · od–do · trajanje)', r: x => zak ? `${x.alj || '—'} · ${x.poc || ''}–${x.kraj || ''}${x.tr ? ' · ' + x.tr : ''}` : `<div class="row" style="gap:4px">${inp(x, 'alj', 44, 'ljudi')}${inp(x, 'poc', 58, 'od')}${inp(x, 'kraj', 58, 'do')}</div>${x.tr ? `<div class="small muted">trajanje ${x.tr}</div>` : ''}` },
    { k: 'nap', l: 'Napomena', r: x => inp(x, 'nap', 100) }], st, {})}`;
}
function novoPsDlg() {
  modal(`<h3>Novo plansko stajanje</h3>
   <div class="row"><label class="fld" style="margin:0"><span>Datum</span><input class="inp" type="date" id="nd" value="2026-11-19"></label><label class="fld" style="margin:0"><span>Trajanje (h)</span><input class="inp" id="nt" value="8" style="width:80px"></label></div>
   <div class="fld" style="margin-top:10px"><span>Uz koji PZ</span><select class="inp" id="np"><option>PZ1-2026-0004 (sledeći po redu)</option><option>bez PZ-a</option></select></div>
   <p class="small muted">Posle pravljenja otvara se izbor iz kandidata („Šta nije urađeno“); može i kasnije.</p>
   <div class="row"><button class="btn" onclick="const d=q('#nd').value;if(!d){q('#nd').style.borderColor='red';return}const ps={id:Math.max(...PSL.map(p=>p.id))+1,datum:d,traj:parseInt(q('#nt').value)||8,pz:q('#np').value.split(' ')[0]==='bez'?'bez PZ-a':q('#np').value.split(' ')[0],st:'U pripremi',stavke:[]};PSL.push(ps);closeM();go('ps',{id:ps.id});setTimeout(()=>kandDlg(ps.id),30)">Napravi</button><button class="btn ghost" onclick="closeM()">Otkaži</button></div>`)
}
function ukloniDlg(id, sid) { const ps = psById(id), x = ps.stavke.find(s => s.id === sid);
  modal(`<h3>Ukloni stavku</h3><p>${esc(x.n)}</p><p class="small muted">${x.izv === 'ručno' ? 'Ručna stavka se briše sa spiska.' : 'Stavka se vraća među kandidate i može da se izabere za ovo ili neko sledeće stajanje.'}${x.izv === 'akcija' ? ' Akcija ostaje otvorena.' : ''}</p>
   <div class="row"><button class="btn" style="background:var(--red)" onclick="const ps=psById(${id});ps.stavke=ps.stavke.filter(s=>s.id!=='${sid}');closeM();render()">Ukloni</button><button class="btn ghost" onclick="closeM()">Nazad</button></div>`) }
function psSet(id, sid, f, v) { const s = psById(id).stavke.find(x => x.id === sid); s[f] = f === 'alj' ? (parseInt(v) || '') : v; render() }  // dodela zaduženog → obaveštenje zaduženom
function psUr(id, sid, v) { const s = psById(id).stavke.find(x => x.id === sid);
  if (v === 'NE' && s.pr === 'Mora') { modal(`<h3>„Mora“ nije urađeno</h3><p>${esc(s.n)}</p><div class="fld"><span>Razlog (obavezan)</span><input class="inp" id="mr"></div><p class="small muted">Direktor dobija obaveštenje; stavka ostaje kandidat za sledeće stajanje.</p>
    <div class="row"><button class="btn" onclick="if(!q('#mr').value){q('#mr').style.borderColor='red';return}const s=psById(${id}).stavke.find(x=>x.id==='${sid}');s.ur='NE';s.nap=q('#mr').value;closeM();render()">Sačuvaj</button><button class="btn ghost" onclick="closeM();render()">Nazad</button></div>`); return }
  s.ur = v; render() }
function kandDlg(id) {
  const ps = psById(id), K = kandidati(ps); S._kand = K;
  const grp = ['akcija', 'kvar', 'preneto', 'pumpa'], lab = { akcija: 'Otvorene akcije', kvar: 'Otvoreni kvarovi (bez akcije)', preneto: 'Neurađeno sa prošlog stajanja', pumpa: 'Pozicije bez pumpe' };
  const z = pzInfo(ps);
  modal(`<h3>Šta nije urađeno — izaberi za ${isoD(ps.datum)}</h3>
   <div class="banner info">Poslednji urađen PZ: <b>${z.last ? z.last.br + ' · ' + z.last.dat : '—'}</b> · Sledeći PZ: <b>${esc(z.next.br)} · ${z.next.dat}</b> (${esc(z.next.eng)}). Posao može da se doda „uz PZ“ — tada ga radi i upisuje inženjer PZ-a.</div>
   <p class="small muted">Štiklirajte šta ide u ovo stajanje i podesite prioritet, službu i zaduženog. Ostalo ostaje kandidat za sledeće stajanje. Preporučene (akcije „U sledećem planskom zastoju“) su već štiklirane; ako ih ne izaberete, rok im se pomera na sledeći PZ.</p>
   <div style="max-height:60vh;overflow:auto">${grp.map(g => { const x = K.map((k, i) => [k, i]).filter(([k]) => k.izv === g); return x.length ? `<h2 style="font-size:15px">${lab[g]} (${x.length})</h2><div class="list">${x.map(([k, i]) => `<div class="it" style="align-items:flex-start"><input type="checkbox" class="kc" data-i="${i}" ${k.pre || g === 'preneto' ? 'checked' : ''} style="margin-top:4px"><span class="t"><b>${esc(k.n)}</b><span class="small muted">${k.ref ? esc(k.ref) + ' · ' : ''}${k.info || ''}</span>
     <span class="row" style="margin-top:4px"><select class="inp kp" data-i="${i}" style="width:auto;padding:4px">${PRIO.map(p => `<option ${p === k.pr ? 'selected' : ''}>${p}</option>`).join('')}</select><select class="inp ks" data-i="${i}" style="width:auto;padding:4px">${SLUZBE.map(s => `<option ${s === k.sl ? 'selected' : ''}>${s}</option>`).join('')}</select>${zadSel('kz', '', `data-i="${i}"`)}<label class="small"><input type="checkbox" class="ku" data-i="${i}"> uz PZ</label></span></span></div>`).join('')}</div>` : '' }).join('')}</div>
   <div class="row" style="margin-top:10px"><button class="btn" onclick="kandDodaj(${id})">Dodaj izabrane</button><button class="btn ghost" onclick="closeM()">Otkaži</button></div>`);
}
function kandDodaj(id) { const ps = psById(id), K = S._kand; let n = 0;
  document.querySelectorAll('.kc:checked').forEach(c => { const i = +c.dataset.i, k = K[i]; n++;
    ps.stavke.push({ id: 'N' + (ps.stavke.length + 1), sl: document.querySelector(`.ks[data-i="${i}"]`).value, n: k.n, pr: document.querySelector(`.kp[data-i="${i}"]`).value, izv: k.izv, ref: k.ref, lj: 2, vr: 60, ur: '', alj: '', poc: '', kraj: '', nap: '', zad: document.querySelector(`.kz[data-i="${i}"]`).value, uzPz: document.querySelector(`.ku[data-i="${i}"]`).checked }) });
  closeM(); render() }
function psStavkaDlg(id) { modal(`<h3>Ručna stavka</h3><div class="fld"><span>Rad</span><textarea class="inp" id="pn"></textarea></div>
  <div class="row"><label class="fld" style="margin:0"><span>Služba</span><select class="inp" id="psl">${SLUZBE.map(s => `<option>${s}</option>`).join('')}</select></label><label class="fld" style="margin:0"><span>Prioritet</span><select class="inp" id="ppr">${PRIO.map(p => `<option ${p === 'Srednji' ? 'selected' : ''}>${p}</option>`).join('')}</select></label></div>
  <div class="row"><label class="fld" style="margin:0"><span>Planirano ljudi</span><input class="inp" id="plj" value="2" style="width:80px"></label><label class="fld" style="margin:0"><span>Planirano vreme (h:mm)</span><input class="inp" id="pvr" value="1:00" style="width:90px"></label></div>
  <div class="row"><label class="fld" style="margin:0"><span>Zadužen</span>${zadSel('', '', 'id="pzd"')}</label><label class="small"><input type="checkbox" id="puz"> radi se uz PZ</label></div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="if(!q('#pn').value){q('#pn').style.borderColor='red';return}const ps=psById(${id});ps.stavke.push({id:'N'+(ps.stavke.length+1),sl:q('#psl').value,n:q('#pn').value,pr:q('#ppr').value,izv:'ručno',ref:'',lj:parseInt(q('#plj').value)||1,vr:toMin(q('#pvr').value.padStart(4,'0'))??60,ur:'',alj:'',poc:'',kraj:'',nap:'',zad:q('#pzd').value,uzPz:q('#puz').checked});closeM();render()">Dodaj</button><button class="btn ghost" onclick="closeM()">Otkaži</button></div>`) }
function zakljuciDlg(id) { const ps = psById(id), bez = ps.stavke.filter(s => !s.ur).length, ne = ps.stavke.filter(s => s.ur === 'NE').length, ak = ps.stavke.filter(s => s.ur === 'DA' && s.izv === 'akcija');
  modal(`<h3>Zaključi stajanje ${isoD(ps.datum)}</h3>${bez ? `<div class="banner err">${bez} stavki nema upisano „Urađeno“ (DA/NE).</div>` : ''}
   <p>${ne} neurađenih stavki vraća se među kandidate za sledeće stajanje (ne ulaze same u plan).</p>
   ${ak.length ? `<p>Urađene stavke iz akcija (${ak.length}) — zatvoriti i akcije?</p><ul class="small">${ak.map(s => `<li>${esc(s.ref)} – ${esc(s.n)}</li>`).join('')}</ul>` : ''}
   <div class="row"><button class="btn" ${bez ? 'disabled' : ''} onclick="const ps=psById(${id});ps.st='Zaključeno';ps.stavke.filter(s=>s.ur==='DA'&&s.izv==='akcija').forEach(s=>{const a=ACTIONS.find(x=>x.br===s.ref);if(a){a.st='Zatvorena';a.zat=USERS[S.role].n+': urađeno u planskom stajanju '+isoD(ps.datum)}});closeM();render()">Zaključi${ak.length ? ' i zatvori akcije' : ''}</button><button class="btn ghost" onclick="closeM()">Nazad</button></div>`) }
function pzSaved() { let ps = PSL.find(p => p.st !== 'Zaključeno');
  if (!ps) { const t = S.pzTip || 'PZ4'; ps = { id: Math.max(...PSL.map(p => p.id)) + 1, datum: '2026-10-29', traj: 8, pz: `${t}-2026-000${t === 'PZ4' ? 3 : 4}`, st: 'U pripremi', stavke: [] }; PSL.push(ps) }  // zakazivanje PZ-a otvara stajanje
  const K = kandidati(ps);
  modal(`<h3>PZ zakazan</h3><p>Uz PZ je otvoreno plansko stajanje <b>${isoD(ps.datum)}</b>.</p><div class="banner warn">Šta nije urađeno: <b>${K.length}</b> kandidata — ${K.filter(k => k.izv === 'akcija').length} otvorenih akcija, ${K.filter(k => k.izv === 'kvar').length} kvarova, ${K.filter(k => k.izv === 'preneto').length} neurađenih sa prošlog stajanja, ${K.filter(k => k.izv === 'pumpa').length} pozicija bez pumpe.</div>
   <div class="row"><button class="btn" onclick="closeM();go('ps',{id:${ps.id}});setTimeout(()=>kandDlg(${ps.id}),30)">Napravi spisak poslova</button><button class="btn ghost" onclick="closeM()">Kasnije</button></div>`) }

/* ---------------- kontrole mockupa ---------------- */
q('#roleSel').onchange=e=>{S.role=e.target.value;S.view=S.role==='ing'?'phone':'laptop';S.scr='dash';S.loggedIn=true;render()};
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});
document.querySelectorAll('#netSeg button').forEach(b=>b.onclick=()=>{S.net=b.dataset.n==='1';render()});
render();
</script>
</body>
</html>
