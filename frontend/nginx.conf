# =============================================================================
# TPM pregledi — frontend nginx vhost (unutar `frontend` kontejnera). Elixir blueprint 17.
# Servira React build + proxy /api/* → backend. Listen 8080 (non-root). SPA fallback.
# Ovaj fajl se include-uje u http{} kontekst (conf.d), pa `map` ovde sme.
# =============================================================================

# X-Forwarded-Proto: PROSLEDI vrednost koju je postavio spoljni proxy (Traefik), a ne
# sopstveni $scheme (koji je ovde uvek "http" jer TLS terminira Traefik). Bez ovoga
# backend misli da je HTTP → refresh cookie bez `Secure`. (blueprint 12 #25)
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

# Body limit: 2m za aplikacije bez uploada; 5m ako postoji Excel uvoz (blueprint 12 #28).
client_max_body_size 2m;

gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_proxied      any;
gzip_comp_level   6;
gzip_types        application/javascript application/json application/xml
                  text/css text/plain text/xml image/svg+xml;

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root        /usr/share/nginx/html;
    index       index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # ─── Streamovani download (Excel/PDF) — proxy_buffering off SAMO ovde ───────
    # Regex location uvek ima prednost nad prefiksnim /api/, nezavisno od redosleda.
    # Putanja se menja po aplikaciji (ovde generički „izvoz").
    location ~ ^/api/v1/.*/(excel|pdf)$ {
        proxy_pass         http://tpm-pregledi-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }

    # ─── /api/* → backend (namenski alias `tpm-pregledi-backend`, NE ime servisa) ────
    # Na deljenoj proxy-net mreži generičko ime `backend` može da pripada tuđem
    # kontejneru; alias je jedinstven (blueprint 17 §2).
    location /api/ {
        proxy_pass         http://tpm-pregledi-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        # Backend sam šalje svoje sigurnosne hedere; da ne bi bilo dupliranih (i različitih)
        # vrednosti na API odgovorima, nginx-ove skidamo samo za /api/.
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  X-Content-Type-Options;
        proxy_hide_header  Referrer-Policy;
        proxy_hide_header  Strict-Transport-Security;
    }

    # ─── Hash-ovani asseti — godinu dana keš ───────────────────────────────────
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        include    /etc/nginx/snippets/security-headers.conf;   # add_header gore poništava nasleđivanje
        try_files  $uri =404;
    }

    # ─── index.html — nikad keš (entry point sa hash referencama) ──────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include    /etc/nginx/snippets/security-headers.conf;
        try_files  $uri =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
