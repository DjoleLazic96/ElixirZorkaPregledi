# =============================================================================
# Deljeni sigurnosni HTTP hederi (nginx snippet). Elixir blueprint 12 §6.
# Include-uje se u `server` bloku I u svakom `location` koji ima sopstveni
# `add_header` (nginx ne nasleđuje add_header u takve blokove) — tako je CSP
# na JEDNOM mestu. U image-u: /etc/nginx/snippets/security-headers.conf
# =============================================================================

# CSP: SPA bez CDN-a; 'unsafe-inline' u style-src zbog Tailwind-a i inline pozicioniranja
# dropdown-a; img/font 'self' + data: za inline SVG (lucide); connect-src 'self' jer API
# ide kroz isti origin.
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    always;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options        "DENY"     always;
add_header X-Content-Type-Options "nosniff"  always;
add_header Referrer-Policy    "no-referrer"                               always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
